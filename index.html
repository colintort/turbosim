<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurboSim in the browser (test)</title>
<style>
  :root { --bg: #0a0f1f; --panel: #111a33; --text: #e8eeff; --muted: #8e9bc7; --ok: #7dff9b; --bad: #ff6b6b; --cyan: #38e1ff; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; margin: 0; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: var(--muted); }
  table { border-collapse: collapse; margin: 12px 0; }
  td { padding: 3px 10px; border-bottom: 1px solid #26335f; }
  td:last-child { font-family: Consolas, monospace; color: var(--cyan); }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  pre { background: var(--panel); padding: 10px; border-radius: 8px; max-height: 50vh; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  button { background: var(--cyan); color: #04202a; border: 0; border-radius: 6px; padding: 6px 14px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<!-- TurboSim web proof of concept (1.10.11 follow-up, WEB_PLAN.md Option A).
     Runs TurboSim's own backend/*.py, unchanged, in the browser with Pyodide
     0.29.3 (Python 3.13, CoolProp 7.2.0, NumPy, SciPy). Local test only:
     serve the ThermoAnal folder (web_poc/serve.bat) and open /web_poc/. -->
<h1>TurboSim in the browser: test</h1>
<div class="hint">TurboSim's own Python solver, unchanged, running in this page (Pyodide). Nothing is installed or sent anywhere.</div>
<table id="t"></table>
<button id="go" disabled>Run the 42 textbook and ME 313 checks</button>
<span id="status" class="hint"></span>
<pre id="out"></pre>
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>
<script>
const rows = [];
const T = document.getElementById("t");
const row = (what, value, cls = "") => {
  rows.push([what, value]);
  const tr = T.insertRow();
  tr.insertCell().textContent = what;
  const c = tr.insertCell();
  c.textContent = value;
  if (cls) c.className = cls;
};
const secs = (a, b) => `${((b - a) / 1000).toFixed(1)} s`;
window.__poc = { rows, done: false };

(async () => {
  const t0 = performance.now();
  const py = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.29.3/full/" });
  const t1 = performance.now();
  row("Python started (Pyodide " + py.version + ")", secs(t0, t1));
  await py.loadPackage(["numpy", "scipy", "coolprop", "micropip"]);
  const t2 = performance.now();
  row("NumPy, SciPy, CoolProp loaded", secs(t1, t2));

  // TurboSim's backend, file for file, from this computer
  const files = await (await fetch("files.json")).json();
  py.FS.mkdirTree("/home/pyodide/backend");
  for (const f of files) py.FS.writeFile(`/home/pyodide/backend/${f}`, await (await fetch(`backend/${f}`)).text());
  py.runPython("import sys; sys.path.insert(0, '/home/pyodide/backend')");
  const t3 = performance.now();
  row(`${files.length} backend files loaded`, secs(t2, t3));
  row("Ready to solve (first visit, all downloads)", secs(t0, t3));
  row("CoolProp version", py.runPython("import CoolProp; CoolProp.__version__"));

  // one solve: Moran Example 8.2, the same payload the tests use
  const solve = `
import time, json
from system_solver import solve_system
p = {"fluid": "Water", "unitSystem": "SI", "cycle": {"netPower": 100000},
     "states": {"1": {"P": 8000, "x": 1}, "2": {"P": 8}, "3": {"x": 0}},
     "nodes": {"t": {"type": "turbine", "name": "Turbine", "ports": {"in": 1, "out": 2}, "assumptions": {"adiabatic": True}, "params": {"eta": 0.85}},
               "c": {"type": "hx", "name": "Condenser", "ports": {"a_in1": 2, "a_out1": 3}, "assumptions": {"aIsobaric": True}},
               "p": {"type": "pump", "name": "Pump", "ports": {"in": 3, "out": 4}, "assumptions": {"adiabatic": True}, "params": {"eta": 0.85}},
               "b": {"type": "hx", "name": "Boiler", "ports": {"a_in1": 4, "a_out1": 1}, "assumptions": {"aIsobaric": True}}}}
t = time.perf_counter(); r = solve_system(p); first = time.perf_counter() - t
t = time.perf_counter()
for _ in range(5): r = solve_system(p)
again = (time.perf_counter() - t) / 5
eta = [s for s in r["work"]["cycle"]["steps"] if s["head"] == "Thermal efficiency"][0]["lines"][1][1]
json.dumps({"errors": r["errors"], "first": first, "again": again, "eta": eta})`;
  const s = JSON.parse(py.runPython(solve));
  row("Moran 8.2 Rankine: errors", s.errors.length ? s.errors.join("; ") : "none", s.errors.length ? "bad" : "ok");
  row("Moran 8.2: first solve / each after", `${(s.first * 1000).toFixed(0)} ms / ${(s.again * 1000).toFixed(0)} ms`);
  row("Show my work, thermal efficiency", s.eta);

  // PDF reports: ReportLab from PyPI (pure Python wheel)
  try {
    const t4 = performance.now();
    await py.runPythonAsync("import micropip; await micropip.install('reportlab')");
    const n = py.runPython(`
from report import build_report
len(build_report({"title": "Web test", "sections": [{"kind": "notes", "title": "Notes", "lines": ["TurboSim in the browser"]},
    {"kind": "work", "title": "Worked solution", "items": [r["work"]["cycle"]]}]}))`);
    row("PDF report (ReportLab)", `${n} bytes, ${secs(t4, performance.now())} to install and build`, "ok");
  } catch (e) {
    row("PDF report (ReportLab)", "failed: " + String(e).split("\n").slice(-2).join(" "), "bad");
  }
  window.__poc.ready = true;

  const go = document.getElementById("go");
  go.disabled = false;
  go.onclick = async () => {
    go.disabled = true;
    document.getElementById("status").textContent = " runningâ€¦ (about 2â€“5 minutes; the ME 313 sweep is the long part)";
    await new Promise((r) => setTimeout(r, 50));
    const t5 = performance.now();
    const out = py.runPython(`
import io, contextlib, validate_textbook as vt
buf = io.StringIO()
with contextlib.redirect_stdout(buf):
    ok = vt.print_table(vt.run())
buf.getvalue()`);
    const t6 = performance.now();
    document.getElementById("out").textContent = out;
    const last = out.trim().split("\n").pop();
    row("Validation", last, /(\d+) of \1 /.test(last) ? "ok" : "bad");
    row("Validation time in the browser", secs(t5, t6));
    document.getElementById("status").textContent = "";
    window.__poc.done = true;
  };
  if (location.hash === "#run") go.click();
})().catch((e) => {
  row("Failed", String(e), "bad");
  window.__poc.error = String(e);
});
</script>
</body>
</html>
